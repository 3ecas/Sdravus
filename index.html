<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sdravus</title>
  <link rel="icon" href="assets/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@400;600;700;800&display=swap" />

  <link rel="stylesheet" href="css/base.css?v=45" />
  <link rel="stylesheet" href="css/layout.css?v=45" />
  <link rel="stylesheet" href="css/sidebar.css?v=45" />
  <link rel="stylesheet" href="css/view.css?v=45" />
  <link rel="stylesheet" href="css/activity-bar.css?v=45" />
  <link rel="stylesheet" href="css/components.css?v=45" />
  <link rel="stylesheet" href="css/actions.css?v=45" />
  <link rel="stylesheet" href="css/areas.css?v=45" />
  <link rel="stylesheet" href="css/stash.css?v=45" />
  <link rel="stylesheet" href="css/gear.css?v=45" />
  <link rel="stylesheet" href="css/context-menu.css?v=45" />

  <script type="module" src="js/main.js?v=45"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">🏰</span>
        <span class="brand-name">Sdravus</span>
      </div>
      <nav class="menu" id="menu" aria-label="Main menu"></nav>
    </aside>

    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle" aria-label="Open menu">☰</button>
        <span class="topbar-title" id="topbarTitle"></span>
      </header>
      <div class="activity-bar" id="activityBar" hidden></div>
      <section class="view" id="view"></section>
    </main>
  </div>
</body>
</html>
